; MUDRA AI - ESP32 embedded display controller
; Board: ESP32 DevKit V1 (classic ESP32 / WROOM-32, 240 MHz, 4 MB flash)
;
; Previously targeted an ESP32-S3-DevKitC-1 N16R8. The hardware in use is a
; classic ESP32, so the target below is esp32dev. GPIO 6-11 are SPI flash on this
; chip and GPIO 34-39 are input-only, which is why the S3 pin map cannot be used.
;
; USB CDC is not applicable to the classic ESP32: Serial is UART0 on GPIO1/GPIO3
; through the board's USB-serial bridge.

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

monitor_speed = 921600
monitor_filters = direct, esp32_exception_decoder
; Do not reset/park the target when the serial monitor opens.
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800

build_flags =
    -std=gnu++17
    -DMUDRA_ENABLE_TOUCH=1
    -DMUDRA_TOUCH_DEBUG=0
    -DTOUCH_PIN_XP=33
    -DTOUCH_PIN_XM=2
    -DTOUCH_PIN_YP=4
    -DTOUCH_PIN_YM=32
    -DMUDRA_LCD_CONTROLLER=1
    -DMUDRA_LCD_ROTATION=0
    -DMUDRA_LCD_GRAM_TEST=0
    -DMUDRA_FORCE_LCD_TEST=0

    ; --- LCD pin map (see src/config/pin_config.h for the constraints) ---
    -DMUDRA_LCD_RST=13
    -DMUDRA_LCD_CS=4
    -DMUDRA_LCD_DC=2
    -DMUDRA_LCD_WR=5
; RD has no spare GPIO on this board: the shield's A0 (RD) is tied to 3V3 and
; the read-back path is unavailable. -1 = not assigned.
    -DMUDRA_LCD_RD=-1
    -DMUDRA_LCD_D0=33
    -DMUDRA_LCD_D1=32
    -DMUDRA_LCD_D2=27
    -DMUDRA_LCD_D3=26
    -DMUDRA_LCD_D4=25
    -DMUDRA_LCD_D5=23
    -DMUDRA_LCD_D6=22
    -DMUDRA_LCD_D7=19


lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    bblanchon/ArduinoJson@7.4.3

; Optional: enable touch after calibration is done on this board.
; [env:esp32dev-touch]
; extends = env:esp32dev
