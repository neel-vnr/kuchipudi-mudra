; Diagnostic-only PlatformIO project for the 2.4" TFT shield reference test.
; This does NOT build the MUDRA firmware; it builds the UNO sketch in this
; folder so the panel can be proven independently of the ESP32-S3.
;
;   pio run -t upload --upload-port COM10
;   pio device monitor --port COM10 --baud 9600

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM10
monitor_speed = 9600
lib_deps =
    prenticedavid/MCUFRIEND_kbv
    adafruit/Adafruit GFX Library
