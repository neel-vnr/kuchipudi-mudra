; Diagnostic-only PlatformIO project: resistive touch pin detection and
; calibration on an Arduino UNO, using MCUFRIEND_kbv's own
; TouchScreen_Calibr_native sketch (copied into src/ together with its local
; TouchScreen_kbv driver).
;
; It auto-detects which shield header pins carry the four touch signals and
; prints calibration constants that can be reused unchanged on the ESP32-S3,
; because they describe the panel, not the host.
;
;   pio run -t upload --upload-port COM12
;   pio device monitor --port COM12 --baud 9600

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM12
monitor_speed = 9600
lib_deps =
    prenticedavid/MCUFRIEND_kbv
    adafruit/Adafruit GFX Library
