; Diagnostic-only: raw x/y/z touch readout on an Arduino UNO.
;   pio run -t upload --upload-port COM12
;   pio device monitor --port COM12 --baud 9600

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM12
monitor_speed = 9600
lib_deps =
    prenticedavid/MCUFRIEND_kbv
    adafruit/Adafruit GFX Library
